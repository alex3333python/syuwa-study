<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided by `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Marela — タブレット向け学習アプリ">
  <!-- iPad / Safari: correct layout metrics and touch targets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Brand assets load before Flutter (highest priority) -->
  <link rel="preload" href="brand/marela_icon.png" as="image" fetchpriority="high">
  <link rel="preload" href="brand/marela_wordmark.png" as="image" fetchpriority="high">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Marela">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Marela</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/assets/fonts/gen_interface_jp/subset/standard/GenInterfaceJP-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background-color: #f0f9ff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 55%);
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      transition: opacity 0.35s ease;
    }

    #loading.loading-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-brand {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 72px;
    }

    #loading-brand img {
      display: block;
      height: auto;
      opacity: 1;
    }

    #loading-icon {
      width: min(18vw, 72px);
    }

    #loading-wordmark {
      width: min(42vw, 200px);
    }

    #loading-status {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: #475569;
      text-align: center;
      padding: 0 1.5rem;
      line-height: 1.5;
    }

    .loading-spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid #dbeafe;
      border-top-color: #0082ff;
      border-radius: 50%;
      animation: marela-spin 0.9s linear infinite;
    }

    @keyframes marela-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite" aria-busy="true">
    <div id="loading-brand" aria-label="Marela">
      <img id="loading-icon" src="brand/marela_icon.png" alt="" width="72" height="72" fetchpriority="high" decoding="sync">
      <img id="loading-wordmark" src="brand/marela_wordmark.png" alt="Marela" fetchpriority="high" decoding="sync">
    </div>
    <div class="loading-spinner" aria-hidden="true"></div>
    <div id="loading-status">読み込み中です。2回目以降はすぐ開きます。</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
