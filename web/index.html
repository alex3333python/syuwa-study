<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided by `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Marela — タブレット向け学習アプリ">
  <!-- iPad / Safari: correct layout metrics and touch targets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Marela">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Marela</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Keep Flutter fullscreen on mobile Safari; reduce double-tap zoom fights. */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background-color: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      transition: opacity 0.35s ease;
    }

    #loading.loading-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-logo {
      width: min(40vw, 180px);
      height: auto;
    }

    #loading-title {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #0082ff;
    }

    #loading-status {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: #555;
      text-align: center;
      padding: 0 1.5rem;
      line-height: 1.5;
    }

    .loading-spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid #e8f4ff;
      border-top-color: #0082ff;
      border-radius: 50%;
      animation: marela-spin 0.9s linear infinite;
    }

    @keyframes marela-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite" aria-busy="true">
    <img id="loading-logo" src="icons/Icon-192.png" alt="" width="192" height="192">
    <div id="loading-title">Marela</div>
    <div class="loading-spinner" aria-hidden="true"></div>
    <div id="loading-status">読み込み中です。初回は1〜2分かかることがあります。</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
